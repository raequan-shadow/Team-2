" fill="#000" font-size="13" font-weight="700">8</text><text x="297.739" y="482.542" fill="#000" font-size="13" textLength="145.228">200 JSON array of decks</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg9" data-source-line="29"><line x1="269.509" y1="534.102" x2="311.509" y2="534.102" style="stroke:#181818;stroke-width:1;"/><line x1="311.509" y1="534.102" x2="311.509" y2="547.102" style="stroke:#181818;stroke-width:1;"/><line x1="270.509" y1="547.102" x2="311.509" y2="547.102" style="stroke:#181818;stroke-width:1;"/><polygon points="280.509,543.102,270.509,547.102,280.509,551.102,276.509,547.102" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="276.509" y="521.069" fill="#000" font-size="13" font-weight="700">9</text><text x="287.739" y="512.894" fill="#000" font-size="13" textLength="192.918">Map API JSON to UI deck shape;</text><text x="287.739" y="529.245" fill="#000" font-size="13" textLength="149.576">set decks and lastRefresh</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg10" data-source-line="30"><polygon points="48.131,589.805,38.131,593.805,48.131,597.805,44.131,593.805" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="42.131" y1="593.805" x2="258.509" y2="593.805" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="54.131" y="580.772" fill="#000" font-size="13" textLength="14.46" font-weight="700">10</text><text x="72.591" y="572.597" fill="#000" font-size="13" textLength="179.918">Render deck cards, availability,</text><text x="72.591" y="588.948" fill="#000" font-size="13" textLength="93.234">and update time</text></g><path d="M90.712,606.805 L90.712,697.805 L437.712,697.805 L437.712,616.805 L427.712,606.805 L90.712,606.805" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M427.712,606.805 L427.712,616.805 L437.712,616.805 L427.712,606.805